server {
  listen 80;
  # Explicit IPv6 bind. This nginx.conf overrides the stock default.conf, which means nginx's
  # auto-IPv6-injection (the docker-entrypoint 30-tune-worker-processes / listen-fixup step that
  # only runs for the stock config) never fires — so without this line nginx listens on IPv4
  # only. The container health check hits http://localhost/, and inside the container `localhost`
  # resolves to ::1 first, which was then refused → container reported unhealthy while serving
  # real IPv4 traffic fine. Binding [::]:80 explicitly fixes the health check.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Asset uploads (POST /api/workspaces/:id/assets/upload) carry the file base64-encoded inside a
  # JSON body, and base64 inflates by ~33% — so nginx's 1m DEFAULT rejected roughly anything over a
  # 750KB image with a 413 before the request ever reached the app. The app itself allows 10mb
  # (express.json in src/index.ts).
  #
  # Deliberately set ABOVE the app's limit, not equal to it: whichever layer is stricter produces the
  # error, and nginx answers 413 with an HTML page the SPA cannot parse (the user saw a bare
  # "Request failed: 413"), whereas Express answers with JSON the UI can actually display. Keeping
  # nginx looser means the app owns the limit and the message.
  client_max_body_size 12m;

  # Mirrors apps/web/vite.config.ts's dev-server proxy rules, so the same relative-path
  # API calls (BASE_URL = "/api" in src/api/client.ts) work identically in prod.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /objects/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # Real-time bridge (apps/web useRealtime.ts -> API /ws). A WebSocket handshake is an HTTP/1.1
  # request carrying `Upgrade: websocket` + `Connection: Upgrade`; without an explicit location
  # that forwards those headers, /ws falls through to the SPA fallback below and nginx answers
  # 200 index.html instead of proxying the upgrade — the browser handshake then fails and
  # reconnects forever, so live campaign/research progress never streams. Note /ws is at the API
  # ROOT (not under /api), matching the WebSocket server attached at /ws in apps/api.
  location /ws {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Long-lived connection: don't let nginx cut an idle socket between server pushes.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Vite content-hashes every file under /assets/ (e.g. index-Dg0SwgkF.css), so the filename
  # itself changes whenever the content changes. That makes them safe to cache forever — a new
  # build produces new filenames rather than mutating these, so `immutable` can never serve stale
  # bytes. Prevents re-downloading unchanged JS/CSS on every visit.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — any route not handled above resolves to index.html so client-side
  # routing (react-router) owns the path instead of nginx 404ing on a hard refresh.
  location / {
    # index.html is NOT content-hashed and points at the current bundle hashes, so it must never
    # be cached — a stale index.html would reference JS/CSS bundle names that no longer exist
    # after a rebuild (blank page / 404s on assets). `no-cache` = revalidate every time.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
