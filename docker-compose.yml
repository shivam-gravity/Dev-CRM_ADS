# Wraps the whole platform — api, web, scraper-service, and all 10 background workers —
# alongside Postgres/Redis, so `docker compose up -d --build` is
# the one command that starts everything with restart-on-crash. Before first run: copy
# .env.example to .env and fill in JWT_SECRET / INTERNAL_SERVICE_KEY / TOKEN_ENCRYPTION_KEY
# (compose refuses to start without them — see .env.example for how to generate them).
#
# A `traefik` reverse proxy fronts the stack so each service has a memorable *.localhost
# hostname on port 80 instead of a port number (see the traefik service below for the map).
# The raw published ports are kept too, so anything still pointing at localhost:PORT works.
#
# Local per-service dev without Docker is untouched — `npm run dev:api` etc. still work
# exactly as before; this file is the containerized/production-shaped path.

x-app-env: &app-env
  NODE_ENV: production
  # External Postgres (CRM DB host) — connected directly, no pgbouncer. Credentials come from
  # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB in .env (set them to the CRM DB's values).
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@198.244.141.77:5432/${POSTGRES_DB:-adgo}?schema=public
  # External Redis on the Docker host, logical DB 1. `host.docker.internal` (not 127.0.0.1) is
  # how a container reaches a service on the host; requires the extra_hosts mapping below.
  REDIS_URL: redis://host.docker.internal:6379/1
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set — see .env.example}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY must be set — see .env.example}
  CRM_JWT_SHARED_SECRET: ${CRM_JWT_SHARED_SECRET:-dev-crm-shared-secret}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  # Where OAuth round-trips send the browser back to. Left EMPTY on purpose: the api then falls back
  # to PUBLIC_ORIGIN (see gateway/webAppUrl.ts), which is already this deployment's browser-facing
  # origin, so the common case needs no configuration. Set it only when the SPA is served from a
  # different origin than the API. It was previously absent entirely, which meant the container could
  # never receive it and every OAuth redirect went to the Vite dev server on localhost:5173.
  WEB_APP_URL: ${WEB_APP_URL:-}
  CRM_ORIGIN: ${CRM_ORIGIN:-}
  SCRAPER_SERVICE_URL: http://scraper-service:4003
  SENTRY_DSN: ${SENTRY_DSN:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
  GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-1024}
  GEMINI_MAX_CONCURRENCY: ${GEMINI_MAX_CONCURRENCY:-4}
  GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-1024}
  # ── Research reuse + LLM cost controls ──
  # These were read by the code but NEVER forwarded here, so they were unsettable in production.
  # Raising the TTL is the single biggest LLM saving available: research was re-run from scratch
  # every 6h even when the previous run was good, and a run that scores below MIN_CONFIDENCE is
  # never reusable at all (measured: only 3 of 10 stored runs qualified).
  CAMPAIGN_RESEARCH_CACHE_TTL_MS: ${CAMPAIGN_RESEARCH_CACHE_TTL_MS:-259200000}
  CAMPAIGN_RESEARCH_MIN_CONFIDENCE: ${CAMPAIGN_RESEARCH_MIN_CONFIDENCE:-0.55}
  # Token accounting. The ledger path is only a local fallback now (Redis is authoritative and
  # shared across all 11 containers) but keep it overridable.
  LLM_MONTHLY_TOKEN_BUDGET: ${LLM_MONTHLY_TOKEN_BUDGET:-5000000}
  LLM_USAGE_LEDGER_PATH: ${LLM_USAGE_LEDGER_PATH:-}
  TOKEN_METER_ENABLED: ${TOKEN_METER_ENABLED:-true}
  # Where uploaded images / generated creatives / crawl artifacts are stored on disk, served back at
  # /objects/<key>. Stated OUTRIGHT rather than left to the code's __dirname-relative default: the
  # image copies apps/api/dist to /repo/service/dist, so the default resolves to
  # /repo/service/data/objects — one level shallower than the repo layout implies. This value and the
  # x-objects-volume mount target below MUST be the same path; see that anchor for what went wrong.
  OBJECT_STORAGE_DIR: /repo/service/data/objects
  SEARXNG_BASE_URL: http://searxng:8080
  CRAWL4AI_BASE_URL: http://crawl4ai:11235
  CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
  # --- Research crawl tuning for a low-core host. All runtime env reads in crawl4aiClient.ts /
  # llmClient.ts, so changing these needs only a container recreate, no image rebuild. On a 2-core
  # box, 4 concurrent headless renders (the old default) oversubscribed CPU, so each render slowed
  # and hit the request timeout -> search/seo research providers failed and overall confidence
  # collapsed (~0.28). Match concurrency to core count and render fewer pages per web search.
  # Raise these on a bigger host (e.g. 4/3) for more parallel enrichment.
  CRAWL4AI_MAX_CONCURRENCY: ${CRAWL4AI_MAX_CONCURRENCY:-2}
  WEB_SEARCH_ENRICH_TOP_N: ${WEB_SEARCH_ENRICH_TOP_N:-2}
  RUNWAY_API_KEY: ${RUNWAY_API_KEY:-}
  SCRAPEGRAPH_SERVICE_URL: ${SCRAPEGRAPH_SERVICE_URL:-}
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
  META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_OAUTH_REDIRECT_URI: ${PUBLIC_ORIGIN:-http://localhost:8080}/api/integrations/meta/oauth/callback
  GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
  GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
  GOOGLE_ADS_ACCESS_TOKEN: ${GOOGLE_ADS_ACCESS_TOKEN:-}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  GOOGLE_OAUTH_REDIRECT_URI: ${PUBLIC_ORIGIN:-http://localhost:8080}/api/integrations/google/oauth/callback
  TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
  TIKTOK_ADVERTISER_ID: ${TIKTOK_ADVERTISER_ID:-}
  CRM_INTERNAL_SERVICE_KEY: ${CRM_INTERNAL_SERVICE_KEY:-}
  SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
  SHOPIFY_ADMIN_ACCESS_TOKEN: ${SHOPIFY_ADMIN_ACCESS_TOKEN:-}
  WOOCOMMERCE_STORE_URL: ${WOOCOMMERCE_STORE_URL:-}
  WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY:-}
  WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET:-}

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/Dockerfile.node-service
    args:
      WORKSPACE: apps/api
      DIST_ENTRY: dist/index.js
  image: polluxa-api:local

# DB and Redis are now EXTERNAL (remote Postgres + host Redis), so there are no in-stack
# datastore containers to health-gate on. This maps host.docker.internal -> the Docker host
# so REDIS_URL can reach a Redis running on this box; applied to every service that needs it.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

# Shared object store. LocalFileObjectStorage writes uploaded/generated creatives and crawl artifacts
# here and the api serves them back at /objects/<key>. Mounted on the api and on EVERY container that
# writes objects — otherwise a worker saves the file into its own container's ephemeral fs, the DB
# stores a /objects URL, and the api 404s it (broken-image thumbnails in the campaign builder).
#
# THE MOUNT TARGET IS NOT THE REPO PATH. Do not "correct" it to .../apps/api/data/objects: the image
# copies apps/api/dist to /repo/service/dist (docker/Dockerfile.node-service), so the code resolves
# its storage root to /repo/service/data/objects. This mount was previously at
# /repo/service/apps/api/data/objects — a path nothing ever read or wrote — so uploads landed in the
# container's ephemeral layer and were destroyed by every `up -d --build`, while Postgres kept serving
# the now-dangling /objects URL. Keep this in lockstep with OBJECT_STORAGE_DIR above.
#
# A bind mount, not a named volume, so the files live inside this directory: `ls apps/api/data/objects`
# to inspect, `tar` to back up, and `docker compose down -v` cannot wipe them. Note the container runs
# as root, so the files are root-owned on the host (removing them by hand needs sudo).
x-objects-volume: &objects-volume
  - ./apps/api/data/objects:/repo/service/data/objects

services:
  # Reverse proxy giving every service a memorable hostname instead of a port number.
  # *.localhost resolves to 127.0.0.1 automatically in all major browsers (RFC 6761), so
  # no hosts-file editing is needed. The raw published ports below stay in place too, so
  # existing tooling / OAuth redirects / dev scripts that hit localhost:PORT keep working.
  #
  #   http://app.localhost      -> web (the SPA; also proxies /api and /objects itself)
  #   http://api.localhost      -> api  (direct backend access, e.g. OAuth callbacks / CRM)
  #   http://scraper.localhost  -> scraper-service
  #   http://search.localhost   -> searxng
  #   http://crawl.localhost    -> crawl4ai
  #   http://traefik.localhost  -> Traefik dashboard (routing/health at a glance)
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      # Auto-discover containers by their labels; nothing is exposed unless it opts in.
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --ping=true
    ports:
      - "80:80"
    volumes:
      # Read-only socket so Traefik can watch container start/stop and read routing labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted metasearch — now the ONLY web-search backend in infra/searchRouter.ts (Tavily
  # and Serper, the metered paid vendors, were removed). Behind our own network only (not
  # port-published beyond localhost), so its rate limiter is safely disabled in
  # searxng/settings.yml — a public instance would need it, ours only ever serves this
  # platform's own backend.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.localhost`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Self-hosted crawler/content-extractor — the ONLY external crawl backend now (Firecrawl,
  # the metered vendor, was replaced). infra/scrapeFallback.ts runs this CONCURRENTLY with the
  # in-house Playwright scraper (scraper-service) and merges both results, so crawl4ai's
  # headless render covers JS-heavy pages the in-house HTTP path misses. No per-call quota;
  # reachable only on our own network. Set CRAWL4AI_API_TOKEN to require bearer auth (optional
  # on a private network).
  crawl4ai:
    image: unclecode/crawl4ai:latest
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      # Non-loopback bind (see crawl4ai/config.yml host: 0.0.0.0) requires this token, or the
      # server refuses to start. Must match apps/api's CRAWL4AI_API_TOKEN so the client auth.
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN must be set — see .env.example}
    volumes:
      # Override the stock config, which binds 127.0.0.1 (unreachable via the published port).
      - ./crawl4ai/config.yml:/app/config.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crawl4ai.rule=Host(`crawl.localhost`)"
      - "traefik.http.routers.crawl4ai.entrypoints=web"
      - "traefik.http.services.crawl4ai.loadbalancer.server.port=11235"
    # Headless-Chromium crawls are shared-memory hungry. 1GB was too small for the pool's page
    # count and caused 500s under the research pipeline's parallel fan-out; 2GB + the config's
    # lowered pool.max_pages (6) keeps crawls reliable. mem_limit bounds total container RAM so a
    # leak can't take the host down.
    shm_size: "2gb"
    mem_limit: "3g"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:11235/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *api-image
    restart: unless-stopped
    # Runs pending migrations before every boot — safe to repeat on restart (Prisma no-ops
    # once a migration's already applied) and means "the container is up" already implies
    # "the schema is current," instead of a separate manual deploy step.
    command: sh -c "npx prisma migrate deploy --schema ./apps/api/prisma/schema.prisma && node \"$$DIST_ENTRY\""
    environment: *app-env
    ports:
      - "4000:4000"
    volumes: *objects-volume
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=4000"
    extra_hosts: *host-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`app.localhost`) || Host(`localhost`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper-service
    image: polluxa-scraper-service:local
    restart: unless-stopped
    environment: *app-env
    extra_hosts: *host-gateway
    ports:
      - "4003:4003"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scraper.rule=Host(`scraper.localhost`)"
      - "traefik.http.routers.scraper.entrypoints=web"
      - "traefik.http.services.scraper.loadbalancer.server.port=4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Background workers (apps/api/src/workers/*) — same image as `api`, no HTTP port,
  # just a different compiled entrypoint. BullMQ-backed, so `restart: unless-stopped` is
  # enough for crash recovery: whatever job was mid-flight resumes from Redis on restart. ---

  campaign-generation-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/campaignGenerationWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    # The generation pipeline crawls the target site and persists page HTML + screenshots through
    # objectStorage (research/crawl/crawlPersistence.ts), so it needs the shared store too.
    volumes: *objects-volume

  creative-generation-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/creativeGenerationWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    # Writes generated creatives to the shared object store the api serves from (see anchor above).
    volumes: *objects-volume

  lead-ingestion-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/leadIngestionWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway

  metrics-ingestion-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/metricsIngestionWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway

  research-orchestrator-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/researchOrchestratorWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    # Research providers crawl sites and persist raw HTML + entry-page screenshots through
    # objectStorage (research/providers/WebsiteProvider.ts -> crawlPersistence.ts). Without this the
    # DB records rawHtmlKey/screenshotKey values the api can never read back.
    volumes: *objects-volume

  research-session-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/researchSessionWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    # Same crawl-persistence path as the orchestrator worker (see above).
    volumes: *objects-volume

  crm-webhook-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/crmWebhookWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway

  # Attaches vector (SVG) ad creatives to a freshly-generated campaign. Enqueued directly in
  # the campaign-generation hot path (modules/orchestrator/campaignGenerationPipeline.ts) —
  # WITHOUT this worker, every "generate" silently enqueues creative jobs that never run and
  # no creatives attach to the campaign. concurrency: 2 in the worker, so give it the most RAM
  # of the three. mem_limit bounds the container so a leak can't take the 8GB host down; the job
  # resumes from Redis after an OOM-kill + restart. Tune upward if it OOMs mid-generation.
  vector-ad-generation-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/vectorAdGenerationWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    # Writes generated SVG creatives to the shared object store the api serves from (see anchor above).
    volumes: *objects-volume
    mem_limit: "768m"

  # On-demand + daily competitor ad re-discovery/analysis. Enqueued by
  # POST /businesses/:id/competitors/:competitorId/refresh (gateway/router.ts) and self-schedules
  # a daily repeatable tick (idempotent jobId, so restarts never stack duplicate schedulers).
  competitor-ad-refresh-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/competitorAdRefreshWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    mem_limit: "512m"

  # Evaluates user-defined automation rules against live metrics on a self-scheduled 15-min tick.
  # WITHOUT this worker, automation rules never fire. Light + idle between ticks, so the smallest cap.
  automation-rule-worker:
    <<: *api-image
    restart: unless-stopped
    command: ["node", "dist/workers/automationRuleWorker.js"]
    environment: *app-env
    extra_hosts: *host-gateway
    mem_limit: "384m"

# No top-level `volumes:` block: the object store is a bind mount into this directory (see
# x-objects-volume), and the datastores are external (remote Postgres + host Redis).
